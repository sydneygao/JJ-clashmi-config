  - RULE-SET,youtube_domain,Google                                   #YouTube
  - RULE-SET,google_domain,Google                                     # Google
  - RULE-SET,spotify_domain,Spotify                                     # Spotify
  - RULE-SET,whatsapp_domain,Social                                   # WhatsApp
  - RULE-SET,instagram_domain,Social                                  # Instagram
  - RULE-SET,facebook_domain,Social                                    # Facebook
  - RULE-SET,snapchat_domain,Social                                    # SnapChat
  - RULE-SET,telegram_domain,Social                                    # Telegram
  - RULE-SET,twitter_domain,Social                                       # Twitter
  - RULE-SET,discord_domain,Social                                       # Discord
  - RULE-SET,netflix_domain,Netflix                                       # 奈飞
  - RULE-SET,paypal_domain,PayPal                                      # PayPal
  - RULE-SET,games_domain,Games                                     # Game合集
  - DOMAIN-SUFFIX,2ksports.com,Games                             #2K游戏
  - DOMAIN-SUFFIX,marketingcloudapis.com,Games         #Nintendo应用
  - RULE-SET,github_domain,默认代理                                   # GitHub
