# 名称： JJ-clashmi-config.yaml
# 版本： 2.0
# 日期： 2026.9.1
# 说明： ClashMi 自定义核心覆写配置
# 使用方式：机场完整订阅 + 本配置作为核心覆写
# 节点来源：继承机场订阅中的 proxies / proxy-providers

# ███████████████████████████ 锚点区域 ███████████████████████████

# ══ 出站锚点 ══
Anchor_OB: &Anchor_OB {type: select, proxies: [默认代理, 香港自动, 日本自动, 新加坡自动, 美国自动, 香港手动, 日本手动, 新加坡手动, 美国手动, 手动选择, DIRECT, REJECT]}

# ══ 策略锚点 ══
Anchor_HS: &Anchor_HS {type: select, include-all: true, exclude-type: direct}
Anchor_UT: &Anchor_UT {type: url-test, url: 'http://www.gstatic.com/generate_204', interval: 600, lazy: true, tolerance: 50, timeout: 2000, max-failed-times: 3, hidden: true, include-all: true, exclude-type: direct}

# ══ 规则锚点 ══
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_DN_PROXY: &Anchor_DN_PROXY {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 默认代理}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 默认代理}

# ══ 区域锚点 ══
Anchor_HK: &Anchor_HK '^(?i)(?=.*(香港|🇭🇰|\bHK\b|Hong(?:\s?Kong)?|HKG)).*$'
Anchor_JP: &Anchor_JP '^(?i)(?=.*(日本|🇯🇵|\bJP\b|Japan|NRT|HND|KIX|CTS|FUK)).*$'
Anchor_US: &Anchor_US '^(?i)(?=.*(美国|美國|United\\s*States|🇺🇸|\bUS\b|\bUSA\b|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'
Anchor_SG: &Anchor_SG '^(?i)(?=.*(新加坡|🇸🇬|\bSG\b|Singapore|SGP)).*$'
Anchor_OT: &Anchor_OT '^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置|期|expire date|traffic reset)).*$'

# ███████████████████████████ 核心配置 ███████████████████████████

# ══ 基础配置 ══
mode: rule                                                                    # 工作模式
ipv6: false                                                                   # 全局关闭 IPv6
mixed-port: 7893                                                              # HTTP + SOCKS5 混合代理端口
allow-lan: true                                                               # 允许局域网连接
bind-address: "*"                                                             # 监听全部接口
log-level: warning                                                            # 日志级别
unified-delay: true                                                           # 统一延迟
tcp-concurrent: true                                                          # TCP 并发
profile: {store-selected: true, store-fake-ip: true}                          # 保存策略选择与 Fake-IP 映射

# ══ 管理面板 ══
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 0.0.0.0:9090
external-ui-name: zashboard
external-ui: ui
secret: ""


# ══ TUN配置 ══
tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53, tcp://any:53]
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: false


# ══ 嗅探功能 ══
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    QUIC: {ports: [443]}
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}

  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
#    - "+.tiktok.com"

  skip-domain:
    - "+.apple.com"
    - "+.mijia.cloud"
    - "+.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"


# ══ DNS配置 ══
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false

  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - "rule-set:cn_domain"
    - '+.market.xiaomi.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ███████████████████████████ 策略分组 ███████████████████████████

proxy-groups:

  # ══ 订阅组 ══
  - {name: 默认代理, type: select, proxies: [香港自动, 日本自动, 新加坡自动, 美国自动, 手动选择, DIRECT], icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Final.png}
  - {name: 手动选择, <<: *Anchor_HS, filter: *Anchor_OT, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Outside.png}

  # ══ 规则组 ══
  - {name: Google, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Google.png}
  - {name: Ai, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/OpenAI.png}
  - {name: Apple, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Apple.png}
  - {name: Spotify, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Spotify.png}
  - {name: Social, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Twitter.png}
  - {name: Games, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png}
  - {name: Netflix, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Netflix.png}
  - {name: Microsoft, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Microsoft.png}
  - {name: PayPal, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Paypal.png}
  - {name: Shield, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Reject.png}
  - {name: 漏网之鱼, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Proxy.png}

  # ══ 区域组 ══

  # 香港
  - {name: 香港手动, <<: *Anchor_HS, filter: *Anchor_HK, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/HK02.png}
  - {name: 香港自动, <<: *Anchor_UT, filter: *Anchor_HK, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/HK02.png}

  # 美国
  - {name: 美国手动, <<: *Anchor_HS, filter: *Anchor_US, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/US.png}
  - {name: 美国自动, <<: *Anchor_UT, filter: *Anchor_US, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/US.png}

  # 日本
  - {name: 日本手动, <<: *Anchor_HS, filter: *Anchor_JP, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/JP.png}
  - {name: 日本自动, <<: *Anchor_UT, filter: *Anchor_JP, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/JP.png}

  # 新加坡
  - {name: 新加坡手动, <<: *Anchor_HS, filter: *Anchor_SG, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/SG.png}
  - {name: 新加坡自动, <<: *Anchor_UT, filter: *Anchor_SG, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/SG.png}


# ███████████████████████████ 规则匹配 ███████████████████████████

rules:

  # 1. 私有网络
  - RULE-SET,private_domain,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 2. 个性化强制匹配
  # 需要强制覆盖 cn_domain 的规则必须放在 cn_domain 前面
  - DOMAIN-SUFFIX,clashmi.app,默认代理                             # ClashMi
  - DOMAIN-SUFFIX,overcast.fm,默认代理                             # Overcast
  - DOMAIN-SUFFIX,overcast-cdn.com,默认代理                        # Overcast
  - DOMAIN-SUFFIX,jpush.cn,默认代理                                # 极光推送

  # 个性化直连
  - DOMAIN-SUFFIX,unpkg.com,DIRECT
  - DOMAIN-SUFFIX,jsdelivr.net,DIRECT                              # CDN
  - DOMAIN-SUFFIX,xhscdn.com,DIRECT                                # 小红书 CDN

  # 3. 中国大陆域名
  - RULE-SET,cn_domain,DIRECT

  # 4. AI
  - RULE-SET,ai_domain,Ai                                          # AI 合集
  - DOMAIN-SUFFIX,searchgpt.com,Ai                                 # ChatGPT
  - IP-ASN,399358,Ai,no-resolve                                    # Claude

  # 5. 特定海外服务域名分流
  - RULE-SET,apple_domain,Apple                                    # Apple
  - RULE-SET,youtube_domain,Google                                 # YouTube
  - RULE-SET,google_domain,Google                                  # Google
  - RULE-SET,spotify_domain,Spotify                                # Spotify

  # Social
  - RULE-SET,whatsapp_domain,Social                                # WhatsApp
  - RULE-SET,instagram_domain,Social                               # Instagram
  - RULE-SET,facebook_domain,Social                                # Facebook
  - RULE-SET,snapchat_domain,Social                                # Snapchat
  - RULE-SET,telegram_domain,Social                                # Telegram
  - RULE-SET,twitter_domain,Social                                 # Twitter/X
  - RULE-SET,discord_domain,Social                                 # Discord

  # Netflix
  - RULE-SET,netflix_domain,Netflix                                # Netflix

  # PayPal
  - RULE-SET,paypal_domain,PayPal                                  # PayPal

  # Games
  - RULE-SET,games_domain,Games                                    # 游戏合集
  - DOMAIN-SUFFIX,2ksports.com,Games                               # 2K Games
  - DOMAIN-SUFFIX,marketingcloudapis.com,Games                     # Nintendo App

  # GitHub / Microsoft
  - RULE-SET,github_domain,默认代理                                 # GitHub
  - RULE-SET,microsoft_domain,Microsoft                            # Microsoft

  # 6. 儿童保护
  - DOMAIN-SUFFIX,91porn.com,Shield
  - RULE-SET,porn_domain,Shield

  # 7. IP 分流
  - RULE-SET,google_ip,Google,no-resolve                           # Google IP
  - RULE-SET,facebook_ip,Social,no-resolve                         # Facebook IP
  - RULE-SET,telegram_ip,Social,no-resolve                         # Telegram IP
  - RULE-SET,twitter_ip,Social,no-resolve                          # Twitter/X IP
  - RULE-SET,netflix_ip,Netflix,no-resolve                         # Netflix IP

  # 中国大陆 IP
  - RULE-SET,cn_ip,DIRECT,no-resolve

  # 8. 海外域名兜底
  - RULE-SET,geolocation-!cn,默认代理

  # 9. 全局兜底
  - MATCH,漏网之鱼


