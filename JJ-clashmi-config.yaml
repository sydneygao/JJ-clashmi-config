# 名称： JJ-clashmi-config.yaml
# 版本： 在线更新版
# 日期： 2026.9.1
# 说明： 纯配置文件，不含机场订阅信息

# ███████████████████████████ 锚点区域 ███████████████████████████
# ══ 订阅锚点 ══
Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'http://www.gstatic.com/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$"}
# ══ 出站锚点 ══
Anchor_OB: &Anchor_OB {type: select, proxies: [默认代理, 香港自动, 日本自动, 新加坡自动, 美国自动, 香港手动, 日本手动, 新加坡手动, 美国手动, 手动选择, DIRECT, REJECT]}
# ══ 策略锚点 ══
Anchor_HS: &Anchor_HS {type: select, include-all: true}
Anchor_FB: &Anchor_FB {type: fallback, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: true, timeout: 2000, max-failed-times: 3, hidden: true}
Anchor_UT: &Anchor_UT {type: url-test, url: 'http://www.gstatic.com/generate_204', interval: 600, lazy: true, tolerance: 50, timeout: 2000, max-failed-times: 3, hidden: true, include-all: true}
# ══ 规则锚点 ══
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_DN_PROXY: &Anchor_DN_PROXY {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 默认代理}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 默认代理}
Anchor_CL: &Anchor_CL {type: http, interval: 86400, behavior: classical, format: text}
# ══ 区域锚点 ══
Anchor_HK: &Anchor_HK '^(?i)(?=.*(香港|🇭🇰|\bHK\b|Hong(?:\s?Kong)?|HKG)).*$'
Anchor_JP: &Anchor_JP '^(?i)(?=.*(日本|🇯🇵|\bJP\b|Japan|NRT|HND|KIX|CTS|FUK)).*$'
Anchor_US: &Anchor_US '^(?i)(?=.*(美国|美國|🇺🇸|\bUS\b|\bUSA\b|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'
Anchor_SG: &Anchor_SG '^(?i)(?=.*(新加坡|🇸🇬|\bSG\b)).*$'
Anchor_OT: &Anchor_OT '^(?i)(?!.*(?:流量|订阅|期|expire date|traffic reset)).*$'

# ███████████████████████████ 核心配置 ███████████████████████████
# ══ 基础配置 ══
mode: rule                                                                    # 工作模式  rule（规则模式）/ global（全局模式）/ direct（直连模式）
ipv6: false                                                                     # 网络协议  是否启用 IPv6 支持
mixed-port: 7893                                                          # 监听端口  HTTP + SOCKS5 混合代理端口
allow-lan: true                                                              # 局域连接  是否允许局域网设备连接
bind-address: "*"                                                          # 监听接口  监听的网络接口（* 表示所有接口）
log-level: warning                                                        # 日志级别  silent（静默）/ error（错误）/ warning（警告）/ info（信息）/ debug（调试）
unified-delay: true                                                       # 统一延迟  减少节点延迟抖动
tcp-concurrent: true                                                    # 并发连接  提升多任务性能
profile: { store-selected: true, store-fake-ip: true }         # 保存选择  记住选择的节点和策略组、Fake-IP 映射
# ══ 管理面板 ══
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 127.0.0.1:9090                               # 面板地址 如需局域网访问改为 0.0.0.0:9090
external-ui-name: zashboard                                      # 面板名称
external-ui: ui                                                             # 面板目录
secret: ""                                                                    # 面板密码
# ══ TUN配置 ══
tun:
  enable: true                                                          # 网卡模式  是否启用 TUN 虚拟网卡模式  
  stack: mixed                                                          # 协议类型  网络栈：system（系统栈）/ gvisor（内置用户态栈）/ mixed（混合）
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-detect-interface: true                                      # 自动出口  自动识别默认出口网络接口 （仅内核模式有效）
  auto-route: true                                                     # 自动路由  自动添加系统路由表      （仅内核模式有效）
  auto-redirect: true                                                 # 自动定向  自动将流量重定向至 TUN  （仅内核模式有效）
  strict-route: false                                                   # 路由模式  严格路由模式
  endpoint-independent-nat: false                           # 端点无关  NAT（提高 NAT 类型兼容性，适用于 P2P 和游戏）
# ══ 嗅探功能 ══
sniffer:
  enable: true                                                          # 启用嗅探  提升分流准确性
  override-destination: true                                            # 成功解析  使用嗅探到的域名覆盖原始目标地址
  parse-pure-ip: true                                                   # 反向解析  解析纯 IP 连接（尝试反向解析获得域名）
  force-dns-mapping: true                                               # 强制映射  DNS 映射（对纯 IP 连接尝试 DNS 映射）
  sniff:
    QUIC: { ports: [443] }                                              # 嗅探参数  QUIC 协议流量（HTTP/3 常用端口）
    TLS:  { ports: [443, 8443] }                                        # 嗅探参数  HTTPS（TLS）常用及备用端口
    HTTP: { ports: [80, 8080-8880], override-destination: true }        # 嗅探参数  HTTP 及常见 Web / 代理端口段(嗅探成功后覆盖目标地址)
  force-domain:
    - "+.netflix.com"                                                   # 强制嗅探  Netflix 主域名
    - "+.nflxvideo.net"                                                 # 强制嗅探  Netflix CDN
    - "+.amazonaws.com"                                                 # 强制嗅探  AWS 云服务
    - "+.media.dssott.com"                                              # 强制嗅探  Disney+ 流媒体
#    - "+.tiktok.com"                                                    # 强制嗅探  TikTok 流媒体
  skip-domain:
    - "+.apple.com"                                                     # 跳过嗅探  苹果服务
    - "+.mijia.cloud"                                                   # 跳过嗅探  米家云服务
    - "+.io.mi.com"                                                     # 跳过嗅探  小米设备通信
    - "+.oray.com"                                                      # 跳过嗅探  花生壳服务
    - "+.sunlogin.net"                                                  # 跳过嗅探  向日葵远程控制
    - "+.push.apple.com"                                                # 跳过嗅探  苹果推送服务
# ══ DNS配置 ══
dns:
  enable: true                                                          # 解析服务  启用 Clash 内置 DNS 服务
  ipv6: false                                                            # 网络协议  关闭 IPv6 DNS 解析支持
  listen: 0.0.0.0:7874                                                  # 监听服务  DNS 服务监听地址与端口
  enhanced-mode: fake-ip                                                # 增强模式  FDNS 增强模式（Fake-IP，用于防止 DNS 泄露）
  fake-ip-range: 198.18.0.1/16                                          # 虚拟地址  Fake-IP 虚拟地址池范围
  fake-ip-filter-mode: blacklist                                        # 过滤模式  Fake-IP 过滤模式（命中规则则返回真实 IP）
  respect-rules: false                                                  # 遵循规则  不强制遵循规则顺序
  fake-ip-filter:
    - '+.lan'                                                                   # 真实解析  常见局域网域名后缀
    - '+.local'                                                                 #mDNS（多播 DNS） 使用的特殊域名后缀，常用于局域网内的设备发现和服务发现
    - "rule-set:cn_domain"                                              # 真实解析  大陆域名数据
    - '+.market.xiaomi.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'  
  nameserver:                                                           # 解析服务  请使用运营商提供的 DNS
    - 223.5.5.5
    - 119.29.29.29

