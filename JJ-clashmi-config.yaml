# 名称： JJ-clashmi-config.yaml
# 版本： ClashMi Overwrite
# 日期： 2026.9.1
# 说明： 机场完整订阅 + ClashMi 自定义覆写专用
# 注意：本文件不填写机场订阅地址，不定义 proxies / proxy-providers

# ███████████████████████████ 锚点区域 ███████████████████████████

# ══ 出站锚点 ══
Anchor_OB: &Anchor_OB {type: select, proxies: [默认代理, 香港自动, 日本自动, 新加坡自动, 美国自动, 香港手动, 日本手动, 新加坡手动, 美国手动, 手动选择, DIRECT, REJECT]}

# ══ 策略锚点 ══
Anchor_HS: &Anchor_HS {type: select, empty-fallback: REJECT, include-all: true}
Anchor_UT: &Anchor_UT {type: url-test, empty-fallback: REJECT, interval: 300, lazy: true, timeout: 3000, max-failed-times: 2, hidden: true, url: 'https://www.gstatic.com/generate_204', tolerance: 50, include-all: true}

# ══ 规则锚点 ══
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs}

# ══ 区域锚点 ══
Anchor_HK: &Anchor_HK '(?i)^(?=.*(香港|(?<![a-zA-Z])(hk|hkg)(?![a-zA-Z])|hongkong|hong kong|🇭🇰)).*$'
Anchor_JP: &Anchor_JP '(?i)^(?=.*(日本|(?<![a-zA-Z])(jp|nrt|hnd|kix|cts|fuk)(?![a-zA-Z])|japan|tokyo|🇯🇵)).*$'
Anchor_SG: &Anchor_SG '(?i)^(?=.*(新加坡|(?<![a-zA-Z])(sg|sin|xsp)(?![a-zA-Z])|singapore|🇸🇬)).*$'
Anchor_US: &Anchor_US '(?i)^(?=.*(美国|美國|(?<![a-zA-Z])(us|usa|lax|sfo|jfk|sjc|sea|iad|ord|atl|dfw|mia)(?![a-zA-Z])|america|united states|🇺🇸)).*$'
Anchor_OT: &Anchor_OT '^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$'

# ███████████████████████████ 核心配置 ███████████████████████████

# ══ 基础配置 ══
mode: rule                                                                    # 工作模式
ipv6: false                                                                   # IPv6
mixed-port: 7893                                                              # HTTP + SOCKS5 混合端口
allow-lan: true                                                               # 允许局域网访问
bind-address: "*"                                                             # 监听全部接口
log-level: warning                                                            # 日志级别
unified-delay: true                                                           # 统一延迟
tcp-concurrent: true                                                          # TCP并发
global-ua: clash.meta                                                         # Clash/Mihomo UA
profile: {store-selected: true, store-fake-ip: true}                          # 保存策略及Fake-IP

# ══ 管理面板 ══
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 0.0.0.0:9090
external-ui-name: zashboard
external-ui: ui
secret: ""

# ══ TUN配置 ══
tun:
  enable: true
  stack: mixed
#  dns-hijack: [udp://any:53, tcp://any:53]
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true

# ══ 嗅探功能 ══
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true

  sniff:
    QUIC: {ports: [443]}
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}

  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
#    - "+.tiktok.com"

  skip-domain:
    - "+.apple.com"
    - "+.mijia.cloud"
    - "+.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

# ══ DNS配置 ══
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false

  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - "rule-set:cn_domain"
    - '+.market.xiaomi.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ███████████████████████████ 策略分组 ███████████████████████████

