# 名称：JJ-clashmi-config.yaml
# 版本：2026.09.05
# 日期：2026.09.05
# 说明：ClashMi 配置；机场订阅 + 区域筛选 + MRS Rule Providers


# ███████████████████████████ 机场区域 ███████████████████████████

proxy-providers:
  Airport1:
    url: "https://" # 填写完整机场订阅地址
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300


# ███████████████████████████ 锚点区域 ███████████████████████████

# ══ 订阅锚点 ══
Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$"}

# ══ 出站锚点 ══
Anchor_OB: &Anchor_OB {type: select, proxies: [默认代理, 香港自动, 日本自动, 新加坡自动, 美国自动, 手动选择, DIRECT, REJECT]}

# ══ 策略锚点 ══
Anchor_HS: &Anchor_HS {type: select, include-all: true}

Anchor_FB: &Anchor_FB {type: fallback, url: 'https://www.gstatic.com/generate_204', interval: 300, lazy: true, timeout: 2000, max-failed-times: 3, hidden: true}

Anchor_UT: &Anchor_UT {type: url-test, url: 'https://www.gstatic.com/generate_204', interval: 600, lazy: true, tolerance: 50, timeout: 2000, max-failed-times: 3, hidden: true, include-all: true}

# ══ 规则锚点 ══
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}

Anchor_DN_PROXY: &Anchor_DN_PROXY {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 默认代理}

Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 默认代理}

Anchor_CL: &Anchor_CL {type: http, interval: 86400, behavior: classical, format: text}

# ══ 区域锚点 ══
# 保持 260819 已验证版本的正则

Anchor_HK: &Anchor_HK '^(?i)(?=.*(香港|🇭🇰|\bHK\b|Hong(?:\s?Kong)?|HKG)).*$'

Anchor_JP: &Anchor_JP '^(?i)(?=.*(日本|🇯🇵|\bJP\b|Japan|NRT|HND|KIX|CTS|FUK)).*$'

Anchor_US: &Anchor_US '^(?i)(?!.*(?:AUS|RUS))(?=.*(?:美国|美國|🇺🇸|\bUS\b|\bUSA\b|United\s*States|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'

Anchor_SG: &Anchor_SG '^(?i)(?=.*(新加坡|🇸🇬|\bSG\b)).*$'

Anchor_OT: &Anchor_OT '^(?!.*(流量)).*$'


# ███████████████████████████ 核心配置 ███████████████████████████

# ══ 基础配置 ══

mode: rule

ipv6: false

mixed-port: 7893

allow-lan: true

bind-address: "*"

log-level: warning

unified-delay: true

tcp-concurrent: true

profile: {store-selected: true, store-fake-ip: true}


# ══ 管理面板 ══

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip

external-controller: 0.0.0.0:9090

external-ui-name: zashboard

external-ui: ui

secret: ""


# ══ TUN配置 ══

tun:
  enable: true
  stack: mixed
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true


# ══ 嗅探功能 ══

sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true

  sniff:
    QUIC: {ports: [443]}
    TLS: {ports: [443, 8443]}
    HTTP: {ports: [80, 8080-8880], override-destination: true}

  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"

  skip-domain:
    - "+.apple.com"
    - "+.mijia.cloud"
    - "+.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"


# ══ DNS配置 ══

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false

  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - "rule-set:cn_domain"
    - '+.market.xiaomi.com'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'
    - '*.n.n.srv.nintendo.net'
    - '+.stun.playstation.net'
    - 'xbox.*.*.microsoft.com'
    - '*.*.xboxlive.com'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'

  nameserver:
    - 223.5.5.5
    - 119.29.29.29


# ███████████████████████████ 策略分组 ███████████████████████████

proxy-groups:

  # ══ 默认代理 ══

  - {name: 默认代理, type: select, proxies: [香港自动, 日本自动, 新加坡自动, 美国自动, 手动选择, DIRECT], icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Final.png}

  - {name: 手动选择, <<: *Anchor_HS, filter: *Anchor_OT, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Outside.png}


  # ══ 应用策略组 ══

  - {name: Google, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Google.png}

  - {name: Ai, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/OpenAI.png}

  - {name: Apple, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Apple.png}

  - {name: Spotify, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Spotify.png}

  - {name: Social, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Twitter.png}

  - {name: Games, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png}

  - {name: Netflix, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Netflix.png}

  - {name: Microsoft, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Microsoft.png}

  - {name: PayPal, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Paypal.png}

  - {name: Shield, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Reject.png}

  - {name: 漏网之鱼, <<: *Anchor_OB, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Filter/Proxy.png}


  # ══ 香港 ══

  - {name: 香港自动, <<: *Anchor_UT, filter: *Anchor_HK, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/HK02.png}


  # ══ 日本 ══

  - {name: 日本自动, <<: *Anchor_UT, filter: *Anchor_JP, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/JP.png}


  # ══ 新加坡 ══

  - {name: 新加坡自动, <<: *Anchor_UT, filter: *Anchor_SG, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/SG.png}


  # ══ 美国 ══

  - {name: 美国自动, <<: *Anchor_UT, filter: *Anchor_US, icon: https://raw.githubusercontent.com/erdongchanyo/icon/main/Policy-Country/US.png}


